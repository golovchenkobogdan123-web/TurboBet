<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboBet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div id="profile-section">
            <div class="user-info">
                <div id="user-avatar" class="avatar">?</div>
                <div id="user-username" class="username">Завантаження...</div>
            </div>
            <div class="balance-container">
                <div class="balance-title">Баланс:</div>
                <div id="balance" class="balance-value">0</div>
            </div>
        </div>
        <div id="game-container">
    <button id="daily-case-btn" style="padding: 12px 24px; font-size: 16px; font-weight: bold; background: #38bdf8; color: #0f172a; border: none; border-radius: 12px; cursor: pointer;">
        🎁 Відкрити безкоштовний кейс
    </button>
</div>

    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user;
        console.log(user); // Виведення даних у консоль для перевірки
document.getElementById('daily-case-btn').addEventListener('click', () => {
    alert('Кейс відкрито! Ви отримали бонуси.');
});

        if (user) {
            document.getElementById('user-username').innerText = user.username ? '@' + user.username : user.first_name;
            
            let initials = '?';
            if (user.first_name) {
                initials = user.first_name.charAt(0).toUpperCase();
            } else if (user.username) {
                initials = user.username.charAt(0).toUpperCase();
            }

            document.getElementById('user-avatar').innerText = initials;
        }
    </script>
</body>
</html>
