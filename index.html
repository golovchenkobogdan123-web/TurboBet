<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboBet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div id="profile-section">
            <div class="user-info">
                <div id="user-avatar" class="avatar">?</div>
                <div id="user-username" class="username">Завантаження...</div>
            </div>
            <div class="balance-container">
                <div class="balance-title">Баланс:</div>
                <div id="balance" class="balance-value">0</div>
            </div>
        </div>
        <div id="game-container">
            <div id="multiplier" style="font-size: 48px; font-weight: bold; color: #38bdf8; margin-bottom: 24px;">x1.00</div>
            <button id="cashout-btn" style="padding: 16px 32px; font-size: 18px; font-weight: bold; background: #38bdf8; color: #0f172a; border: none; border-radius: 12px; cursor: pointer;">
                Забрати виграш
            </button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user;
        console.log(user); 

        if (user) {
            document.getElementById('user-username').innerText = user.username ? '@' + user.username : user.first_name;
            
            let initials = '?';
            if (user.first_name) {
                initials = user.first_name.charAt(0).toUpperCase();
            } else if (user.username) {
                initials = user.username.charAt(0).toUpperCase();
            }

            document.getElementById('user-avatar').innerText = initials;
        }

        document.getElementById('daily-case-btn').addEventListener('click', () => {
            const min = 0.1;
            const max = 1.0;
            const prize = (Math.random() * (max - min) + min).toFixed(2);

            let currentBalance = parseFloat(document.getElementById('balance').innerText);
            currentBalance += parseFloat(prize);

            document.getElementById('balance').innerText = currentBalance.toFixed(2);

            alert(`Кейс відкрито! Ви виграли ${prize} TON!`);
        });
    </script>
</body>
</html>
