<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboBet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: var(--bg-card);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }
        .username {
            font-weight: bold;
        }
        .balance-container {
            text-align: right;
        }
        .balance-title {
            color: var(--text-secondary);
            font-size: 12px;
        }
        .balance-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .games-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }
        .game-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid #334155;
            transition: transform 0.1s;
        }
        .game-card:active {
            transform: scale(0.98);
        }
        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .game-icon {
            width: 60px;
            height: 60px;
            background: #334155;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }
        .game-name {
            font-size: 20px;
            font-weight: bold;
        }
        .game-badge {
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }
        .rocket-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }
        .multiplier {
            font-size: 72px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        .btn-action {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(29, 78, 216, 0.3);
            transition: transform 0.1s;
        }
        .btn-bet {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 10px 20px rgba(185, 28, 28, 0.3);
            display: none;
        }
        .btn-action:active {
            transform: scale(0.98);
        }
        .nav-bar {
            background: var(--bg-card);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #334155;
        }
        .nav-item {
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--primary);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .crashed {
            color: #ef4444 !important;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="user-info">
            <div id="user-avatar" class="avatar">?</div>
            <div id="user-username" class="username">Loading...</div>
        </div>
        <div class="balance-container">
            <div class="balance-title">Your balance:</div>
            <div id="balance" class="balance-value">0.00</div>
        </div>
    </div>
    <div class="content" id="main-content">
        <!-- Dashboard Screen -->
        <div id="dashboard-screen" class="games-grid">
            <div class="game-card" id="rocket-game-card">
                <div class="game-info">
                    <div class="game-icon">🚀</div>
                    <div>
                        <div class="game-name">Rocket</div>
                        <div style="color: var(--text-secondary); font-size: 14px;">Try to catch the highest multiplier</div>
                    </div>
                </div>
                <div class="game-badge">HOT</div>
            </div>
        </div>

        <!-- Rocket Game Screen -->
        <div id="rocket-screen" class="rocket-screen" style="display: none;">
            <div id="rocket-multiplier" class="multiplier">x1.00</div>
            <button id="btn-bet" class="btn-action btn-bet">Place Bet</button>
            <button id="btn-cashout" class="btn-action btn-cashout">Cashout</button>
        </div>
    </div>
    <div class="nav-bar">
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            Backpack
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3z"/></svg>
            Invite
        </div>
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6c0-2 4-3.1 6-3.1s6 1.1 6 3.1z"/></svg>
            Leaderboard
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.28 1.45-2.05 3.7-2.05s3.78.78 3.78 2.05h1.27c0-2-1.92-3.05-5.05-3.05V3h-2v2.85c-2.92.35-4.8.85-4.8 2.85 0 2.15 2.1 3.15 5.06 3.9 2.17.55 3 1.25 3 2.25 0 1.5-1.55 2.25-3.8 2.25-2.73 0-3.9-1.07-3.9-2.35H5.8c0 2.5 1.78 3.5 5.03 3.9V21h2v-2.92c3-.38 5-1.25 5-3.9 0-2.45-1.9-3.45-4.03-3.98z"/></svg>
            Earn
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-username').innerText = user.username ? '@' + user.username : user.first_name;
            let initials = '?';
            if (user.first_name) initials = user.first_name.charAt(0).toUpperCase();
            else if (user.username) initials = user.username.charAt(0).toUpperCase();
            document.getElementById('user-avatar').innerText = initials;
        }

        const dashboardScreen = document.getElementById('dashboard-screen');
        const rocketScreen = document.getElementById('rocket-screen');
        const rocketGameCard = document.getElementById('rocket-game-card');
        const homeNav = document.querySelector('.nav-item.active');

        rocketGameCard.addEventListener('click', () => {
            dashboardScreen.style.display = 'none';
            rocketScreen.style.display = 'flex';
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.nav-item')[2].classList.add('active'); 
        });

        const btnBet = document.getElementById('btn-bet');
        const btnCashout = document.getElementById('btn-cashout');
        const multiplierDisplay = document.getElementById('rocket-multiplier');
        const balanceDisplay = document.getElementById('balance');

        let isPlaying = false;
        let multiplier = 1.00;
        let crashPoint = 1.00;
        let gameInterval = null;
        let betAmount = 10.00; 

        function generateCrashPoint() {
            const e = 2.71828;
            const r = Math.random();
            return Math.floor((e - r) / r * 100) / 100;
        }

        btnBet.addEventListener('click', () => {
            let currentBalance = parseFloat(balanceDisplay.innerText);
            if (currentBalance < betAmount) {
                alert('Insufficient funds!');
                return;
            }

            currentBalance -= betAmount;
            balanceDisplay.innerText = currentBalance.toFixed(2);

            isPlaying = true;
            multiplier = 1.00;
            crashPoint = generateCrashPoint();
            multiplierDisplay.innerText = 'x1.00';
            multiplierDisplay.classList.remove('crashed');
            btnBet.style.display = 'none';
            btnCashout.style.display = 'block';

            gameInterval = setInterval(() => {
                multiplier += 0.01;
                multiplierDisplay.innerText = 'x' + multiplier.toFixed(2);

                if (multiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    isPlaying = false;
                    multiplierDisplay.innerText = 'CRASHED';
                    multiplierDisplay.classList.add('crashed');
                    btnBet.style.display = 'block';
                    btnCashout.style.display = 'none';
                }
            }, 50);
        });

        btnCashout.addEventListener('click', () => {
            if (!isPlaying) return;

            clearInterval(gameInterval);
            isPlaying = false;

            let currentBalance = parseFloat(balanceDisplay.innerText);
            let winnings = betAmount * multiplier;
            currentBalance += winnings;
            balanceDisplay.innerText = currentBalance.toFixed(2);

            alert('You cashed out at x' + multiplier.toFixed(2) + '! Won: ' + winnings.toFixed(2));
            btnBet.style.display = 'block';
            btnCashout.style.display = 'none';
        });
    </script>
</body>
</html>
