<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboBet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: var(--bg-card);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }
        .username {
            font-weight: bold;
        }
        .balance-container {
            text-align: right;
        }
        .balance-title {
            color: var(--text-secondary);
            font-size: 12px;
        }
        .balance-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .multiplier {
            font-size: 64px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-cashout:active {
            transform: scale(0.98);
        }
        .nav-bar {
            background: var(--bg-card);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #334155;
        }
        .nav-item {
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--primary);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="user-info">
            <div id="user-avatar" class="avatar">?</div>
            <div id="user-username" class="username">Завантаження...</div>
        </div>
        <div class="balance-container">
            <div class="balance-title">Ваш баланс:</div>
            <div id="balance" class="balance-value">0.00</div>
        </div>
    </div>
    <div class="content">
        <div id="multiplier" class="multiplier">x1.00</div>
        <button id="cashout-btn" class="btn-cashout">Забрати виграш</button>
    </div>
    <div class="nav-bar">
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Головна
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            Інфо
        </div>
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
            Гра
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Профіль
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-username').innerText = user.username ? '@' + user.username : user.first_name;
            let initials = '?';
            if (user.first_name) initials = user.first_name.charAt(0).toUpperCase();
            else if (user.username) initials = user.username.charAt(0).toUpperCase();
            document.getElementById('user-avatar').innerText = initials;
        }
    </script>
</body>
</html>
