<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TurboBet Crash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="logo">🚀 TURBO<span>BET</span></div>
      <div class="balance-box">
        <span>💰 Баланс:</span>
        <strong id="balance">1000</strong>
      </div>
    </header>

    <div class="game-card">
      <div class="canvas-container">
        <div id="rocket" class="rocket">🚀</div>
        <div id="multiplier" class="multiplier">1.00x</div>
        <div id="status-text" class="status-text">Очікування ставки...</div>
      </div>

      <div class="controls">
        <div class="input-group">
          <label>Ставка:</label>
          <input type="number" id="betAmount" value="50" min="10" step="10">
        </div>

        <button id="actionBtn" class="btn btn-primary" onclick="handleAction()">ПОСТАВИТИ</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let balance = 1000;
    let multiplier = 1.00;
    let timer = null;
    let isPlaying = false;
    let crashPoint = 0;

      const btn = document.getElementById('actionBtn');
      const rocket = document.getElementById('rocket');
      const multDisplay = document.getElementById('multiplier');
      const statusText = document.getElementById('status-text');
      const betInput = document.getElementById('betAmount');
      const bet = parseFloat(betInput.value);

      if (!isPlaying) {
        if (bet > balance || bet <= 0) {
          alert('Недостатньо балансу!');
          return;
        }

        balance -= bet;
        document.getElementById('balance').innerText = balance;

        isPlaying = true;
        multiplier = 1.00;
        crashPoint = (Math.random() * 2.5 + 1.1).toFixed(2);

        multDisplay.style.color = "#00ffcc";
        btn.innerText = "ЗАБРАТИ";
        btn.className = "btn btn-success";
